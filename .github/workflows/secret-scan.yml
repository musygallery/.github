name: Secret scan (historique)

# Scanne tout l'historique git du dépôt avec gitleaks.
# Les valeurs trouvées sont masquées (--redact) : le journal et le rapport
# ne donnent que la règle, le fichier, la ligne et le commit.
# Exclusions : .gitleaks.toml (chemins) et .gitleaksignore (empreintes).

on:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: read

concurrency:
  group: secret-scan-${{ github.ref }}
  cancel-in-progress: true

env:
  GITLEAKS_VERSION: "8.24.0"

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Préparer gitleaks (Docker, sinon binaire vérifié)
        run: |
          if command -v docker >/dev/null 2>&1 && docker info >/dev/null 2>&1; then
            echo "GL_MODE=docker" >> "$GITHUB_ENV"
            exit 0
          fi
          case "$(uname -m)" in
            x86_64) arch=x64 ;;
            aarch64|arm64) arch=arm64 ;;
            *) echo "architecture non gérée : $(uname -m)"; exit 1 ;;
          esac
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_${arch}.tar.gz"
          dir="$RUNNER_TEMP/gitleaks"
          mkdir -p "$dir"
          curl -sSfL -o "$dir/$tarball" "$base/$tarball"
          curl -sSfL -o "$dir/checksums.txt" "$base/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          (cd "$dir" && grep " ${tarball}\$" checksums.txt | sha256sum -c -)
          tar -xzf "$dir/$tarball" -C "$dir" gitleaks
          echo "GL_MODE=binary" >> "$GITHUB_ENV"
          echo "GL_BIN=$dir/gitleaks" >> "$GITHUB_ENV"

      - name: Gitleaks (historique complet, valeurs masquées)
        id: scan
        run: |
          set +e
          args="git /repo --redact --no-banner --report-format json --report-path /repo/gitleaks-report.json --exit-code 2 --gitleaks-ignore-path /repo"
          [ -f .gitleaks.toml ] && args="$args --config /repo/.gitleaks.toml"
          if [ "$GL_MODE" = docker ]; then
            docker run --rm --user "$(id -u):$(id -g)" -v "$PWD:/repo" "ghcr.io/gitleaks/gitleaks:v${GITLEAKS_VERSION}" $args
          else
            "$GL_BIN" $(echo "$args" | sed "s#/repo#$PWD#g")
          fi
          code=$?
          echo "code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Résumé
        run: |
          cat > "$RUNNER_TEMP/secret-scan-summary.py" <<'PY'
          import json, os, sys
          path, out = sys.argv[1], sys.argv[2]
          findings = json.load(open(path)) if os.path.exists(path) else []
          lines = [f"## Secret scan : {len(findings)} résultat(s)", ""]
          if findings:
              lines += ["| Règle | Fichier | Ligne | Commit | Date |", "|---|---|---|---|---|"]
              for f in findings:
                  lines.append(f"| {f.get('RuleID')} | `{f.get('File')}` | {f.get('StartLine')} | {f.get('Commit','')[:9]} | {f.get('Date','')[:10]} |")
          text = "\n".join(lines)
          print(text)
          with open(out, "a") as s:
              s.write(text + "\n")
          PY
          if command -v python3 >/dev/null 2>&1; then
            python3 "$RUNNER_TEMP/secret-scan-summary.py" gitleaks-report.json "$GITHUB_STEP_SUMMARY"
          elif [ "$GL_MODE" = docker ]; then
            docker run --rm --user "$(id -u):$(id -g)" -v "$PWD:/w" -v "$RUNNER_TEMP:/t" -v "$GITHUB_STEP_SUMMARY:/summary" -w /w \
              python:3.12-alpine python3 /t/secret-scan-summary.py gitleaks-report.json /summary
          else
            n=$(grep -c '"RuleID"' gitleaks-report.json 2>/dev/null || echo 0)
            echo "## Secret scan : $n résultat(s) (détail dans l'artefact)" | tee -a "$GITHUB_STEP_SUMMARY"
          fi

      - name: Rapport (masqué)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gitleaks-report
          path: gitleaks-report.json
          retention-days: 14
          if-no-files-found: ignore

      - name: Échec si des secrets sont trouvés
        if: steps.scan.outputs.code != '0'
        run: |
          echo "gitleaks a trouvé des résultats (code ${{ steps.scan.outputs.code }}) : voir le résumé du job."
          exit 1
