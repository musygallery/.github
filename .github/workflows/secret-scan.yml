name: Secret scan (historique)

# Scanne tout l'historique git du dépôt avec gitleaks.
# Les valeurs trouvées sont masquées (--redact) : le journal et le rapport
# ne donnent que la règle, le fichier, la ligne et le commit.

on:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: read

concurrency:
  group: secret-scan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Gitleaks (historique complet, valeurs masquées)
        id: scan
        run: |
          set +e
          docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.24.0 \
            git /repo --redact --no-banner \
            --report-format json --report-path /repo/gitleaks-report.json \
            --exit-code 2
          code=$?
          echo "code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Résumé
        run: |
          python3 - <<'PY'
          import json, os
          path = "gitleaks-report.json"
          findings = json.load(open(path)) if os.path.exists(path) else []
          lines = [f"## Secret scan : {len(findings)} résultat(s)", ""]
          if findings:
              lines += ["| Règle | Fichier | Ligne | Commit | Date |", "|---|---|---|---|---|"]
              for f in findings:
                  lines.append(f"| {f.get('RuleID')} | `{f.get('File')}` | {f.get('StartLine')} | {f.get('Commit','')[:9]} | {f.get('Date','')[:10]} |")
          text = "\n".join(lines)
          print(text)
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as s:
              s.write(text + "\n")
          PY

      - name: Rapport (masqué)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gitleaks-report
          path: gitleaks-report.json
          retention-days: 14
          if-no-files-found: ignore

      - name: Échec si des secrets sont trouvés
        if: steps.scan.outputs.code != '0'
        run: |
          echo "gitleaks a trouvé des résultats (code ${{ steps.scan.outputs.code }}) : voir le résumé du job."
          exit 1
